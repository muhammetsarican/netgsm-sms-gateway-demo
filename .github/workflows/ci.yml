name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: PHP 8.3 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite
          coverage: none

      - name: Composer bağımlılıklarını kur
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ortamı hazırla
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Kod stili (Pint)
        run: vendor/bin/pint --test

      - name: Statik analiz (Larastan)
        run: vendor/bin/phpstan analyse --no-progress

      - name: Testler (Pest)
        run: php artisan test

  frontend:
    name: Frontend (vue-tsc, Vite build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
